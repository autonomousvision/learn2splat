# @package _global_
# Mixed-dataset training with PER-SOURCE initializers: ONE learn2splat_dense optimizer trained
# jointly on megasynth (depth-unprojection init) + dl3dv (colmap-SfM init). Each source's scenes are
# initialized by its own initializer via scene_trainer.scene_initializers, then refined by the single
# shared optimizer. Joins learn2splat_megasynth_dense_local.sh + learn2splat_dense.sh.
#
# Self-contained (does NOT inherit train_dl3dv; see train_mixed.yaml for why). colmap is the DEFAULT
# initializer -- it serves dl3dv train AND the single-source eval path (get_eval_cfg carries no source
# tag) -- and megasynth OVERRIDES to depth. Both inits emit sh_degree=3 Gaussians; they must match for
# the shared optimizer (enforced by SceneTrainerCfg.__post_init__).
#
# render_depth is a GLOBAL loss (one weight, below) but modality-gated: LossRenderDepth is applied
# only to scenes whose source provides GT depth (megasynth attaches "depth"+"depth_mask"), and is a
# silent no-op where it's absent (dl3dv). The gate is purely `views.get("depth")` in _curr_gt_depth,
# so it depends only on data-modality availability, not on the source key.
defaults:
  - /dataset@dataset.sources.mega: megasynth
  - /dataset@dataset.sources.dl3dv: dl3dv
  - /scene_trainer/scene_initializer@scene_trainer.scene_initializers.mega: depth
  - override /dataset: mixed
  - override /scene_trainer/scene_initializer: colmap
  - override /scene_trainer/scene_optimizer: learn2splat_dense
  - override /loss: [mse, lpips, deltas, stability, render_depth]
  - override /meta_trainer/train/ckpt_buffer_cfg: default
  - _self_

wandb:
  name: megasynth_dl3dv_mixed_dense
  tags: [mixed, megasynth, dl3dv]

data_loader:
  train:
    batch_size: 1

meta_trainer:
  max_steps: 100_000
  val_check_interval: 0.25
  train:
    loss_on_input_views: true
    loss_on_input_views_num: 4
    use_ckpt_buffer: true
  meta_optimizer:
    lr: 1e-4
    lr_monodepth: 0.0
  test:
    save_at_iters: [0, 1, 5, 10, 50, 100, 200, 300, 400, 500, 1000]

loss:
  mse:
    weight: 1.0
    l1_loss: true
  lpips:
    apply_after_step: 0
    weight: 0.5
    perceptual_loss: true
  deltas:
    weight: 1
    exclude_by_norm_grad: true
    exclude_by_norm_grad_opposite: true
    eps: 1e-8
    apply_after_step: 100
  render_depth:
    weight: 0.05  # global; only contributes for sources that provide GT depth (megasynth)

scene_trainer:
  train_scene_opt: true
  num_update_steps: 2000
  opt_batch_size: 8
  train_max_refine: 6
  train_min_refine: 1
  decoder:
    rasterize_mode: classic
    eps2d: 1e-4
  scene_initializer:                 # DEFAULT init: dl3dv colmap SfM (+ the eval path)
    path: datasets/dl3dv-colmap-sfm
    dl3dv_settings: true
    filter_zero_rgb: true
    eval_fixed_gaussians_num: 70_000
  scene_initializers:                # per-source overrides (keyed by dataset.sources key)
    mega:                            # megasynth: unproject GT depth into a colored point cloud
      init_longer_side: 80
      train_fixed_gaussians_num: 40_000
      eval_fixed_gaussians_num: 40_000
      train_depth_noise_std: 0.05    # corrupt the GT-depth init so the optimizer has geometry to fix

checkpointing:
  pretrained_initializer: null

dataset:
  eval_source: dl3dv
  weights: {mega: 1.0, dl3dv: 1.0}
  sources:
    mega:
      roots: [datasets/megasynth]
      load_depth: true               # required by the depth initializer
      image_shape: [512, 512]
      near: 0.1
      far: 100.
      view_sampler:
        num_context_views: 8
        num_target_views: 6
        min_distance_between_context_views: -1
        max_distance_between_context_views: -1
        initial_min_distance_between_context_views: -1
        initial_max_distance_between_context_views: -1
    dl3dv:
      roots: [datasets/dl3dv-480p-chunks]
      index_name: index_colmap.json
      near: 0.01
      far: 200.
      image_shape: [256, 448]
      view_sampler:
        num_context_views: 64
        num_target_views: 6
        min_distance_between_context_views: -1
        max_distance_between_context_views: -1
        initial_min_distance_between_context_views: -1
        initial_max_distance_between_context_views: -1

output_dir: placeholder
log_slurm_id: true
