defaults:
  - base
  - override refiner: default
  - override lr_scheduler: expon

name: adam

# Adam optimizer
betas: [0.99, 0.999]
eps: 1e-15
weight_decay: 0.0

# 5x base LR; means held constant (lr_final == _means, so means init 5*1.6e-4 == final 5*1.6e-4).
lr_scheduler:
  lr_data:
    _base: 5
  lr_final: 1.6e-4